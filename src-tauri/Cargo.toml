[package]
name = "orboffice"
version = "0.2.0"
description = "A lightweight, local-first desktop office workspace."
authors = ["Orb Technologies"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2" }
tauri-plugin-dialog = "2"
