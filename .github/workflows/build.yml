name: Desktop build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: npm install
      - name: Compile desktop application
        run: npm run build -- --no-bundle
